    <text x="2" y="124" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" letter-spacing="3" fill="#60656D">BRIEF  →  STORY  →  MOTION  →  DELIVERY</text>
    <path d="M2 170H980" fill="none" stroke="#D9D5CA" stroke-width="3"/>
    <path d="M2 170H286" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
    <text x="2" y="217" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#60656D">A local-first production system for review-ready videos.</text>
