<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Codex Video Workflow</title>
  <desc id="desc">Brand mark combining layered video frames, a play symbol, and a production timeline.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EF6A45"/>
      <stop offset="1" stop-color="#D7432F"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="420" rx="34" fill="#F7F5EF"/>
  <rect x="1.5" y="1.5" width="1597" height="417" rx="32.5" fill="none" stroke="#D9D5CA" stroke-width="3"/>

  <g transform="translate(98 74)">
    <rect x="18" y="0" width="248" height="248" rx="38" fill="#FFFFFF" stroke="#171A1F" stroke-width="8"/>
    <rect x="0" y="26" width="248" height="248" rx="38" fill="#F7F5EF" stroke="#171A1F" stroke-width="8"/>
    <path d="M93 80 93 194 184 137Z" fill="url(#accent)"/>
    <path d="M42 227H206" fill="none" stroke="#171A1F" stroke-width="8" stroke-linecap="round"/>
    <circle cx="62" cy="227" r="12" fill="#171A1F"/>
    <circle cx="124" cy="227" r="12" fill="#EF6A45"/>
    <circle cx="186" cy="227" r="12" fill="#171A1F"/>
