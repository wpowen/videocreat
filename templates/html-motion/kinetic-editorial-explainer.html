<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kinetic Editorial Explainer</title>
  <style>
    :root {
      --bg: #f6efe2;
      --ink: #151414;
      --paper: #fffaf0;
      --muted: #6a5f51;
      --accent: #df2634;
      --gold: #f3bd51;
      --left-copy-width: min(58vw, 980px);
      --headline-safe-height: 40vh;
      --support-safe-bottom: 18vh;
      --copy-stack-safe-gap: max(56px, 5.2vh);
      --p: 0;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); font-family: "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif; overflow: hidden; }
    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      color: var(--ink);
      background:
        repeating-linear-gradient(115deg, rgba(40,32,22,.10) 0 1px, transparent 1px 76px),
        linear-gradient(90deg, var(--bg), #fff8eb);
    }
    .rule { position: absolute; inset: 7vh auto auto 4.8vw; width: 54vw; height: 10px; background: var(--accent); transform-origin: left; animation: rule .8s cubic-bezier(.16,1,.3,1) both; }
    .headline {
      position: absolute;
      left: 4.8vw;
      top: 14vh;
      max-width: var(--left-copy-width);
      max-height: var(--headline-safe-height);
      overflow: hidden;
      font-size: clamp(64px, 8vw, 158px);
      line-height: .96;
      font-weight: 950;
      letter-spacing: 0;
    }
    .headline span { display: block; transform: translateY(70px); opacity: 0; animation: rise .72s cubic-bezier(.16,1,.3,1) forwards; }
    .headline span:nth-child(2) { color: var(--accent); animation-delay: .18s; }
    .support {
      position: absolute;
      left: 5.2vw;
      top: auto;
      bottom: var(--support-safe-bottom);
      width: min(42vw, 760px);
      max-height: min(26vh, 270px);
      margin-top: var(--copy-stack-safe-gap);
      padding: 22px 28px;
      border-radius: 22px;
      background: var(--ink);
      color: var(--paper);
      font-size: clamp(26px, 2.5vw, 48px);
      font-weight: 800;
      overflow: hidden;
      transform: translateY(36px);
      opacity: 0;
      animation: rise .65s cubic-bezier(.16,1,.3,1) .55s forwards;
    }
    .artifact {
      position: absolute;
      right: 5vw;
      top: 16vh;
      width: 35vw;
      height: 60vh;
      border: 8px solid var(--ink);
      border-radius: 34px;
      background: var(--paper);
      box-shadow: 28px 28px 0 rgba(0,0,0,.92);
      transform: translateX(0) rotate(0deg);
      opacity: 1;
      animation: artifactIn .9s cubic-bezier(.16,1,.3,1) .25s both, float 5s ease-in-out 1.2s infinite alternate;
    }
    .artifact::before {
      content: "";
      position: absolute;
      left: 12%;
      right: 12%;
      top: 16%;
      height: 18px;
      background: var(--ink);
      box-shadow: 0 90px 0 var(--ink), 0 180px 0 var(--ink), 0 270px 0 var(--ink);
    }
    .seal {
      position: absolute;
      right: 8%;
      bottom: 12%;
      width: 33%;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 7px solid var(--ink);
      background: var(--accent);
      color: white;
      font-size: clamp(40px, 4vw, 86px);
      font-weight: 950;
      transform: scale(1) rotate(-4deg);
      opacity: 1;
      animation: stamp .55s cubic-bezier(.2,1.5,.35,1) 1.02s both;
    }
    .caption {
      position: absolute;
      left: 10vw;
      right: 10vw;
      bottom: 5vh;
      min-height: 104px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      background: rgba(15,15,13,.96);
      color: var(--paper);
      font-size: clamp(26px, 2.3vw, 44px);
      font-weight: 760;
      text-align: center;
    }
    @keyframes rule { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes rise { to { transform: translateY(0); opacity: 1; } }
    @keyframes artifactIn { from { transform: translateX(110px) rotate(2deg); opacity: 0; } to { transform: translateX(0) rotate(0deg); opacity: 1; } }
    @keyframes stamp { from { transform: scale(.6) rotate(-12deg); opacity: 0; } to { transform: scale(1) rotate(-4deg); opacity: 1; } }
    @keyframes float { to { transform: translateY(-16px) rotate(-1deg); } }
  </style>
</head>
<body>
  <main class="stage">
    <div class="rule"></div>
    <h1 class="headline"><span data-field="headlineA">读者不买</span><span data-field="headlineB">灵感</span></h1>
    <div class="support" data-field="support">只追：持续兑现</div>
    <section class="artifact" aria-label="promise contract"><div class="seal" data-field="seal">承诺</div></section>
    <div class="caption" data-field="caption">字幕放在安全区，不能遮挡主体动效。</div>
  </main>
  <script>
    window.motionTemplate = {
      id: "kinetic-editorial-explainer",
      setContent(data = {}) {
        for (const [key, value] of Object.entries(data)) {
          const el = document.querySelector(`[data-field="${key}"]`);
          if (el) el.textContent = value;
        }
      },
      setProgress(progress = 0) {
        document.documentElement.style.setProperty("--p", Math.max(0, Math.min(1, progress)));
      }
    };
  </script>
</body>
</html>
