<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interactive Proof Board</title>
  <style>
    :root { --bg:#efe6d6; --ink:#151414; --paper:#fffaf0; --accent:#d92331; --focus-x:0px; --focus-y:0px; }
    * { box-sizing:border-box; }
    body { margin:0; overflow:hidden; font-family:"PingFang SC","Hiragino Sans GB",system-ui,sans-serif; background:var(--bg); }
    .stage { position:relative; width:100vw; height:100vh; padding:7vh 6vw; background:repeating-linear-gradient(110deg,rgba(28,22,16,.08) 0 1px,transparent 1px 82px), var(--bg); color:var(--ink); }
    .title { width:50vw; margin:0; font-size:clamp(58px,7vw,138px); line-height:.96; font-weight:950; }
    .board { position:absolute; right:5vw; top:10vh; width:43vw; height:68vh; border:8px solid var(--ink); border-radius:34px; background:#252321; box-shadow:24px 24px 0 rgba(0,0,0,.9); transform:translate(var(--focus-x), var(--focus-y)); transition:transform .25s ease-out; }
    svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
    .thread { stroke:var(--accent); stroke-width:7; stroke-linecap:round; fill:none; stroke-dasharray:900; stroke-dashoffset:900; animation:draw 1.3s cubic-bezier(.16,1,.3,1) .45s forwards; }
    .card { position:absolute; width:34%; min-height:22%; padding:18px; border-radius:18px; background:var(--paper); border:5px solid var(--ink); font-size:clamp(20px,1.5vw,34px); line-height:1.15; font-weight:850; opacity:0; transform:translateY(28px) rotate(var(--r)); animation:pop .55s cubic-bezier(.16,1,.3,1) forwards; }
    .card:nth-of-type(1) { left:8%; top:10%; --r:-4deg; animation-delay:.15s; }
    .card:nth-of-type(2) { right:8%; top:23%; --r:3deg; animation-delay:.35s; }
    .card:nth-of-type(3) { left:18%; bottom:13%; --r:2deg; animation-delay:.55s; }
    .lens { position:absolute; right:31vw; bottom:22vh; width:14vw; aspect-ratio:1; border:10px solid var(--accent); border-radius:50%; box-shadow:0 0 0 900px rgba(0,0,0,.05); animation:lens 3s ease-in-out infinite alternate; }
    .caption { position:absolute; left:10vw; right:10vw; bottom:5vh; min-height:96px; display:grid; place-items:center; border-radius:20px; background:rgba(0,0,0,.9); color:var(--paper); font-size:clamp(26px,2.2vw,42px); font-weight:760; }
    @keyframes draw { to { stroke-dashoffset:0; } }
    @keyframes pop { to { opacity:1; transform:translateY(0) rotate(var(--r)); } }
    @keyframes lens { to { transform:translate(18px,-14px) scale(1.04); } }
  </style>
</head>
<body>
  <main class="stage">
    <h1 class="title" data-field="title">证据不是解释出来的</h1>
    <section class="board">
      <svg viewBox="0 0 1000 700" aria-hidden="true">
        <path class="thread" d="M210 180 C360 80 610 170 760 275 S560 560 315 540" />
      </svg>
      <article class="card" data-field="cardA">行动</article>
      <article class="card" data-field="cardB">代价</article>
      <article class="card" data-field="cardC">状态改变</article>
    </section>
    <div class="lens"></div>
    <div class="caption" data-field="caption">让观众看到关系，而不是听作者解释关系。</div>
  </main>
  <script>
    window.addEventListener("pointermove", (event) => {
      const x = (event.clientX / innerWidth - .5) * 18;
      const y = (event.clientY / innerHeight - .5) * 18;
      document.documentElement.style.setProperty("--focus-x", `${x}px`);
      document.documentElement.style.setProperty("--focus-y", `${y}px`);
    });
    window.motionTemplate = {
      id: "interactive-proof-board",
      setContent(data = {}) {
        for (const [key, value] of Object.entries(data)) {
          const el = document.querySelector(`[data-field="${key}"]`);
          if (el) el.textContent = value;
        }
      },
      setProgress(progress = 0) {
        document.querySelector(".thread").style.strokeDashoffset = String(900 - 900 * Math.max(0, Math.min(1, progress)));
      }
    };
  </script>
</body>
</html>
